<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joe Moe AI</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=2000') center center;
    background-size:cover;
    position:relative;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
}

p{
    font-size:1.2rem;
}

.buttons{
    margin-top:30px;
}

.btn{
    display:block;
    width:280px;
    margin:12px auto;
    padding:16px;
    border-radius:10px;
    color:white;
    text-decoration:none;
    font-size:1.1rem;
    font-weight:bold;
}

.spotify{
    background:#1DB954;
}

.apple{
    background:#666;
}

.amazon{
    background:#FF9900;
}

.youtube{
    background:#FF0000;
}

.footer{
    padding:40px;
    text-align:center;
}

</style>

</head>
<body>

<div class="hero">

<div class="overlay">

<h1>Joe Moe AI</h1>

<p>Musik mit Haltung, Herz und künstlicher Intelligenz</p>

<div class="buttons">

<a class="btn spotify"
href="https://open.spotify.com/artist/4RMZczDeXXDJ1aBYWQXMIm"
target="_blank">Spotify</a>

<a class="btn apple"
href="https://music.apple.com/de/artist/joe-moe-ai/1883946342"
target="_blank">Apple Music</a>

<a class="btn amazon"
href="https://music.amazon.de/artists/B0GS435QYP/joe-moe-ai"
target="_blank">Amazon Music</a>

<a class="btn youtube"
href="https://www.youtube.com/@JoeMoeAI"
target="_blank">YouTube Music</a>

</div>

</div>

</div>

<div class="footer">

<h2>Joe Moe AI</h2>

<p>
Generationen • Wahre Freunde • Camperleben • Summer Nights
</p>

</div>

</body>
</html>
